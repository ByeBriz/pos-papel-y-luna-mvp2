<!-- Modal Producto -->
<div id="modal-producto" class="modal">
    <div class="contenido-modal">
        <h2 id="titulo-modal-producto">Nuevo Producto</h2>
        <input type="hidden" id="prod-id">
        <div class="formulario">
            <div class="grupo-input">
                <label>Código</label>
                <input type="text" id="prod-codigo" disabled>
            </div>
            <div class="grupo-input">
                <label>Nombre del Producto</label>
                <input type="text" id="prod-nombre">
            </div>
            <div class="grupo-input">
                <label>Categoría</label>
                <select id="prod-categoria"></select>
            </div>
            <div class="grupo-input">
                <label>Ruta de la Imagen</label>
                <input type="text" id="prod-imagen" placeholder="Ej: Imagenes/cuaderno.jpg">
            </div>
            <div class="grupo-input-mitad">
                <div class="grupo-input">
                    <label>Costo</label>
                    <input type="number" id="prod-costo" min="0">
                </div>
                <div class="grupo-input">
                    <label>Precio de Venta</label>
                    <input type="number" id="prod-precio" min="0">
                </div>
            </div>
            <div class="grupo-input-mitad">
                <div class="grupo-input">
                    <label>¿Controla Inventario?</label>
                    <select id="prod-seguimiento">
                        <option value="true">Sí</option>
                        <option value="false">No</option>
                    </select>
                </div>
                <div class="grupo-input">
                    <label>Stock Inicial</label>
                    <input type="number" id="prod-stock" min="0">
                </div>
            </div>
        </div>
        <div class="acciones-modal">
            <button class="btn btn-rojo" id="btn-cancelar-producto">Cancelar</button>
            <button class="btn btn-verde" id="btn-guardar-producto">Guardar</button>
        </div>
    </div>
</div>
